name: Dart
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: make check
      - run: make build
      - run: build/bodytmi progression evaluate --input examples/hang-progression.json
      - run: build/bodytmi measurement resolve --input examples/body-mass.json
      - run: build/bodytmi progression double --input examples/double-progression.json
