name: bodytmi_android_probe
description: Android feasibility probe for the BodyTMI storage stack.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  path_provider: ^2.1.5
  bodytmi_core: any
  bodytmi_application: any
  bodytmi_storage: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
dependency_overrides:
  # Workspace packages by path; this app stays outside the pure Dart workspace.
  bodytmi_core:
    path: ../../packages/bodytmi_core
  bodytmi_application:
    path: ../../packages/bodytmi_application
  bodytmi_storage:
    path: ../../packages/bodytmi_storage
flutter:
  assets:
    # Copies of public repository examples; the device cannot read the repo.
    - assets/upper-a.json
    - assets/history-import.json
